<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>فحص المكتبة</title>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body style="font-family:Tahoma; text-align:center; padding:50px;">
    <h1>نتيجة الفحص:</h1>
    <h2 id="result">جارٍ الفحص...</h2>
    <script>
        if (typeof THREE !== 'undefined') {
            document.getElementById('result').innerHTML = '✅ المكتبة تحمّلت بنجاح!';
            document.getElementById('result').style.color = 'green';
        } else {
            document.getElementById('result').innerHTML = '❌ لم تتحمّل المكتبة';
            document.getElementById('result').style.color = 'red';
        }
    </script>
</body>
</html>
