<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة ثلاثي الأبعاد</title>
    <style>
        body { font-family: Tahoma; text-align: center; padding: 20px; background: #f0f9ff; }
        #canvas-container { width: 100%; height: 400px; background: #e8f5e9; border-radius: 12px; margin: 20px auto; max-width: 600px; }
        h1 { color: #2e7d32; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <h1>☀️ تجربة Three.js</h1>
    <div id="canvas-container"></div>
    <p>إذا ظهر لك مكعب أبيض → المكتبة تعمل بنجاح ✅</p>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8f5e9);
        
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / 400, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 400);
        container.appendChild(renderer.domElement);

        // إنشاء مكعب يمثل اللوح الشمسي
        const geometry = new THREE.BoxGeometry(4, 0.1, 3);
        const material = new THREE.MeshStandardMaterial({ color: 0x1565c0 });
        const panel = new THREE.Mesh(geometry, material);
        scene.add(panel);

        // إضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        camera.position.set(6, 5, 6);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            panel.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
